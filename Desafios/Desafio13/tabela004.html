<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 300px;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        tr > th {
            background-color: gray;
            color: white;
            border: 2px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <caption>notas de alunos</caption>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="row">Disciplina</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="row">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td rowspan="4">Exatas</td>
            <td>Matemática</td>
            <td>8.5</td>
            <td>9.0</td>
            <td>8.75</td>
        </tr>
        <tr>
            <td>Física</td>
            <td>7.0</td>
            <td>8.0</td>
            <td>7.5</td>
        </tr>
        <tr>
            <td>Química</td>
            <td>8.0</td>
            <td>8.5</td>
            <td>8.25</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td>9.0</td>
            <td>8.5</td>
            <td>8.75</td>
        </tr>
        <tr>
            <th colspan="4">Média de Exatas</th>
            <th>8.25</th>
        </tr>
        <tr>
            <td rowspan="2" scope="rowgroup">Humanas</td>
            <td>História</td>
            <td>7.5</td>
            <td>8.0</td>
            <td>7.75</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td>8.0</td>
            <td>7.5</td>
            <td>7.75</td>
        </tr>
        <tr>
            <th colspan="4">Média de Humanas</th>
            <th>7.75</th>
        </tr>
    </tbody>
</body>
</html>
